site_name: findingspec Documentation
site_description: Domain-neutral finding model for security, accessibility, i18n, quality engineering, and content
site_url: https://plexusone.github.io/findingspec/
repo_url: https://github.com/plexusone/findingspec
repo_name: plexusone/findingspec

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Concepts:
      - Finding Model: concepts/finding-model.md
      - Severity: concepts/severity.md
      - Interchange & Adapters: concepts/interchange.md
  - Domains:
      - Security: domains/security.md
      - Accessibility (a11y): domains/a11y.md
      - Internationalization (i18n): domains/i18n.md
      - Quality Engineering (qe): domains/qe.md
      - Content: domains/content.md
  - Reference:
      - Location: reference/location.md
      - Evidence, Remediation & Metadata: reference/evidence-remediation.md
      - Reports: reference/report.md
  - Specs:
      - PRD: specs/PRD.md
      - TRD: specs/TRD.md
      - Roadmap: specs/ROADMAP.md
  - Releases:
      - Overview: releases/index.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md
